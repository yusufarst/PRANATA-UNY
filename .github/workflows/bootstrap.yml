name: bootstrap

# Temporary evidence workflow for TASK-002 to TASK-004 (QUALITY_GATES 4.1, OD-37).
# TASK-005 folds it into ci.yml and removes it.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Temporary: removed before the final HEAD of the TASK-002 PR.
  scaffold:
    name: scaffold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Report the PostgreSQL image digest for pinning
        run: |
          docker pull --quiet postgres:18
          docker inspect --format '{{index .RepoDigests 0}}' postgres:18
          docker run --rm postgres:18 postgres --version
          google-chrome --version

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The kit's tagged Packagist release lags behind; the official installer takes its current branch.
      - name: Create the application with the official Laravel installer
        run: |
          composer global require laravel/installer --no-interaction
          "$(composer global config bin-dir --absolute --quiet)/laravel" new --help
          "$(composer global config bin-dir --absolute --quiet)/laravel" new app --react --pest --npm --no-boost --no-interaction

      - name: Record versions
        working-directory: app
        run: |
          {
            php --version | head -n 1
            composer --version
            node --version
            npm --version
            composer global show laravel/installer --format=json | jq -r '"installer " + .versions[0]'
            git ls-remote https://github.com/laravel/react-starter-kit.git refs/heads/main
            composer show --locked --format=json
          } > ../scaffold-versions.txt

      # The installer writes .env with a key and a SQLite file; neither may reach a public artifact.
      - name: Refuse dependencies, environment files and keys in the artifact
        working-directory: app
        run: |
          rm -rf vendor node_modules public/build public/hot .env database/database.sqlite
          if grep -rIlE 'base64:[A-Za-z0-9+/]{20,}' .; then echo 'key material found'; exit 1; fi

      - name: Pack
        run: tar -czf scaffold.tar.gz -C app .

      - name: Upload scaffold
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scaffold
          path: |
            scaffold.tar.gz
            scaffold-versions.txt
          if-no-files-found: error
          retention-days: 7
