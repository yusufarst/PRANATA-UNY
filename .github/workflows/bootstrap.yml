name: bootstrap

# Temporary evidence workflow for TASK-002 to TASK-004 (QUALITY_GATES 4.1, OD-37).
# TASK-005 folds it into ci.yml and removes it.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-boot:
    name: app-boot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        # Throwaway database on the runner, without any credential.
        env:
          POSTGRES_USER: pranata
          POSTGRES_DB: pranata_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U pranata -d pranata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: pranata_test
      DB_USERNAME: pranata
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      # The key lives only in this job's .env, which never reaches an artifact.
      - name: Create the environment file and test key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Production build
        run: npm run build

      - name: Migrations (fresh and rollback)
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Pest
        run: php artisan test

      - name: Pint
        run: composer lint:check

      - name: Larastan
        run: composer types:check

      - name: Frontend lint and format
        run: npm run check

      - name: TypeScript
        run: npm run types:check

      # QUALITY_GATES 2.1: no unexcepted high or critical finding. A dependency arrives here for the first time.
      - name: Dependency audits
        run: |
          composer audit
          npm audit --audit-level=high

      - name: Start the test server
        run: |
          php artisan migrate:fresh --force
          nohup php artisan serve --host=127.0.0.1 --port=8000 > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/up; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Check the login and registration routes
        run: |
          login_code="$(curl -s -o login.html -w '%{http_code}' http://127.0.0.1:8000/login)"
          register_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/register)"
          echo "GET /login = $login_code, GET /register = $register_code"
          test "$login_code" = 200
          test "$register_code" = 404
          # The page JSON may escape the slash in the Inertia component name.
          grep -Eq 'auth\\?/login' login.html

      - name: Screenshot the login page
        run: |
          mkdir -p screenshots
          for size in 390,844 1440,900; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size="$size" --virtual-time-budget=8000 \
              --screenshot="screenshots/login-${size/,/x}.png" http://127.0.0.1:8000/login
          done
          file screenshots/login-390x844.png | grep -q '390 x 844'
          file screenshots/login-1440x900.png | grep -q '1440 x 900'

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: login-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  db-integration:
    name: db-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        # Throwaway database on the runner, without any credential.
        env:
          POSTGRES_USER: pranata
          POSTGRES_DB: pranata_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U pranata -d pranata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      gotenberg:
        image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
        ports:
          - 127.0.0.1:3000:3000
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: pranata_test
      DB_USERNAME: pranata
      PRANATA_POSTGRES_MAJOR: '18'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Create the environment file and test key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Production build
        run: npm run build

      - name: Migrations (fresh and rollback)
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force

      - name: The reset guard stops a foreign database
        run: |
          if DB_DATABASE=other_app php artisan migrate:fresh --force > guard.log 2>&1; then
            cat guard.log
            echo 'migrate:fresh was not refused'
            exit 1
          fi
          cat guard.log
          grep -q 'forbidden on database \[other_app\]' guard.log

      - name: Pest in parallel
        run: php artisan test --parallel --processes=4

      - name: PostgreSQL server version
        run: php artisan db:show --json | jq '.platform | {name, version, database: .config.database}'

      - name: Gotenberg health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health -o health.json; then break; fi
            sleep 2
          done
          jq -e '.status == "up" and .details.libreoffice.status == "up"' health.json

      - name: Gotenberg LibreOffice conversion of a synthetic file
        run: |
          printf 'Dokumen uji sintetis PRANATA.\n' > synthetic.txt
          curl -fsS --form files=@synthetic.txt http://127.0.0.1:3000/forms/libreoffice/convert -o synthetic.pdf
          test "$(head -c 4 synthetic.pdf)" = '%PDF'
          ls -l synthetic.pdf

  bootstrap-gate:
    name: bootstrap-gate
    if: always()
    needs: [app-boot, db-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the tested merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pull_request run tests the synthetic merge commit; this file links it to the PR, HEAD, base and tree.
      - name: Write the evidence
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -n \
            --argjson pr "$PR" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg merge_sha "$MERGE_SHA" \
            --arg tree_sha "$(git rev-parse 'HEAD^{tree}')" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            '{pr: $pr, head_sha: $head_sha, base_sha: $base_sha, merge_sha: $merge_sha, tree_sha: $tree_sha, run_id: $run_id, run_attempt: $run_attempt}' \
            > bootstrap-evidence.json
          cat bootstrap-evidence.json

      - name: Upload the evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-evidence
          path: bootstrap-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Refuse any job that did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")'
