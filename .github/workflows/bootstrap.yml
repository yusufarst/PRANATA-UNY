name: bootstrap

# Temporary evidence workflow for TASK-002 to TASK-004 (QUALITY_GATES 4.1, OD-37).
# TASK-005 folds it into ci.yml and removes it.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-boot:
    name: app-boot
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: echo ok

  bootstrap-gate:
    name: bootstrap-gate
    if: always()
    needs: [app-boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the tested merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pull_request run tests the synthetic merge commit; this file links it to the PR, HEAD, base and tree.
      - name: Write the evidence
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -n \
            --argjson pr "$PR" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg merge_sha "$MERGE_SHA" \
            --arg tree_sha "$(git rev-parse 'HEAD^{tree}')" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            '{pr: $pr, head_sha: $head_sha, base_sha: $base_sha, merge_sha: $merge_sha, tree_sha: $tree_sha, run_id: $run_id, run_attempt: $run_attempt}' \
            > bootstrap-evidence.json
          cat bootstrap-evidence.json

      - name: Upload the evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-evidence
          path: bootstrap-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Refuse any job that did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")'
