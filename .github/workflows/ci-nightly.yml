name: ci-nightly

# Scheduled regression on main. It is not covered by ci-gate (QUALITY_GATES section 4.1). Later Tasks add the full
# E2E suite (TASK-007), the light performance test and the deep Gotenberg integration tests of the document Tasks.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-nightly
  cancel-in-progress: false

jobs:
  ci-nightly:
    name: ci-nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        # Throwaway database on the runner, without any credential.
        env:
          POSTGRES_USER: pranata
          POSTGRES_DB: pranata_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U pranata -d pranata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      gotenberg:
        image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
        ports:
          - 127.0.0.1:3000:3000
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: pranata_test
      DB_USERNAME: pranata
      GOTENBERG_URL: http://127.0.0.1:3000
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Set up Node with the npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Create the environment file and test key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Production build
        run: npm run build

      - name: Full migration test
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Full Pest suite, including the Gotenberg group
        run: php artisan test --fail-on-skipped
